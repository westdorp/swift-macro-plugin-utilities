name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Package Gate
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # The Xcode .xcode-version names, never the runner image default, which GitHub moves.
      - name: Select the committed Xcode
        run: |
          version="$(cat "$GITHUB_WORKSPACE/.xcode-version")"
          developer_dir="/Applications/Xcode_$version.app/Contents/Developer"
          test "$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | sed -n 1p)" = "Xcode $version"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Test
        run: make ci-test
