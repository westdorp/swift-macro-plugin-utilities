name: CI
on: [push, pull_request]
jobs:
  test:
    name: Package Gate
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Select the committed Xcode
        uses: ./.github/actions/select-xcode
      - name: Test
        run: make ci-test
